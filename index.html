      return `${topbarHtml(t('diary_new'))}${renderPlanSubHeader()}
      <div class="card">
        <div class="field"><label>${t('sch_date')}</label><input type="date" value="${diaryForm.date||new Date().toISOString().slice(0,10)}" oninput="diaryForm.date=this.value"></div>
        <div class="field"><label>${t('diary_heading')}</label><input type="text" placeholder="${t('diary_heading_ph')}" value="${diaryForm.title||''}" oninput="diaryForm.title=this.value"></div>
        <div class="field" style="margin-bottom:0;"><label>${t('diary_content')}</label><textarea placeholder="${t('diary_content_ph')}" oninput="diaryForm.content=this.value">${diaryForm.content||''}</textarea></div>
      </div>
      <button class="btn btn-gold" style="width:100%; margin-bottom:10px;" onclick="uiSaveDiary()">${t('diary_save')}</button>
      <button class="btn btn-outline" style="width:100%;" onclick="diaryForm=null; render()">${t('cancel')}</button>`; 
  }
  
  const seasons = getPlanSeasons();
  let activeFilter = window.planSeasonFilter === 'todas' ? state.currentSeason : (window.planSeasonFilter || state.currentSeason);
  let filterUI = seasons.length > 1 ? `<div style="margin-bottom:14px; overflow-x:auto; display:flex; gap:6px; padding-bottom:6px;"><div class="seg-btn ${activeFilter==='TUDO'?'active':''}" style="flex:none; padding:8px 12px; font-size:10px;" onclick="window.planSeasonFilter='TUDO'; render()">Todas</div>${seasons.map(s=>`<div class="seg-btn ${activeFilter===s?'active':''}" style="flex:none; padding:8px 12px; font-size:10px;" onclick="window.planSeasonFilter='${s}'; render()">${s}</div>`).join('')}</div>` : '';
  const filtered = state.diary.filter(d => activeFilter==='TUDO' || getEntitySeason(d) === activeFilter);

  return `${topbarHtml(t('hub_plan_title'))}${renderPlanSubHeader()}
    <button class="btn btn-gold" style="width:100%; margin-bottom:14px;" onclick="diaryForm={title:'', content:'', date: new Date().toISOString().slice(0,10)}; render()">${t('diary_new')}</button>${filterUI}
    ${filtered.length ? filtered.map(d => { 
        const open = expandedDiary === d.id; 
        return `<div class="card match-item" onclick="if(!event.target.closest('button')){ expandedDiary=expandedDiary==='${d.id}'?null:'${d.id}'; render(); }">
            <div class="match-head-row">
                <div class="match-head" style="flex:1;">
                    <div><div class="opp">${d.title}</div><div class="date">${d.date.split('-').reverse().join('/')}</div></div>
                </div>
                <button class="quick-del" onclick="event.stopPropagation(); askConfirm('Apagar esta nota do diário?', ()=>deleteDiary('${d.id}'))">🗑</button>
            </div>
            ${open ? `<div class="goal-list"><div class="notes-readonly">📝 ${d.content}</div></div>` : ''}
        </div>`; 
    }).join('') : `<div class="empty">${t('diary_none')}</div>`}`;
}

window.uiSaveVideo = function(){ if(!videoForm.title || !videoForm.title.trim()){ showToast(t('vid_name')); return; } if(!videoForm.url || !videoForm.url.trim()){ showToast(t('vid_url')); return; } state.videos.unshift({ id: uid(), title: escapeHTML(videoForm.title.trim()), type: videoForm.type || 'treino', url: escapeHTML(videoForm.url.trim()), notes: escapeHTML(videoForm.notes || '') }); videoForm = null; saveState(); render(); showToast(t('msg_vid_saved')); };
window.deleteVideo = function(id){ state.videos = state.videos.filter(v=>v.id!==id); saveState(); render(); };
window.shareVideoWhatsapp = function(id){
  const v = state.videos.find(x=>x.id===id); if(!v) return;
  let text = `🎬 *${v.title}*\n\n🔗 ${v.url}\n`;
  if(v.notes) text += `\n📝 *Notas:* ${v.notes}\n`;
  window.shareContent(text);
};

function buildMatchReportHTML(m){
  const sc = m.goals.filter(g=>g.type==='scored').length; 
  const co = m.goals.filter(g=>g.type==='conceded').length;
  const dateStr = m.date.split('-').reverse().join('/');
  let locLabel = (m.location||'casa') === 'casa' ? t('match_home') : t('match_away');
  
  let totalMatchMins = 0;
  if (m.isNewManualModel) {
    totalMatchMins = (m.manualHalf1Duration || 0) + (m.manualHalf2Duration || 0);
  } else if (m.singleHalf) {
    totalMatchMins = m.halfDuration || state.defaultHalfDuration || 30;
  } else {
    totalMatchMins = (m.halfDuration || state.defaultHalfDuration || 30) * (m.numberOfHalves || 2);
  }

  let squadIds = [];
  if(m.originalSchedule && m.originalSchedule.callup && m.originalSchedule.callup.length > 0) {
    squadIds = [...m.originalSchedule.callup];
  } else {
    squadIds = [...new Set([
      ...(m.lineup||[]), 
      ...(m.subs||[]).map(s=>s.inId), 
      ...(m.subs||[]).map(s=>s.outId),
      ...Object.keys(m.ratings||{})
    ])];
  }

  if(squadIds.length === 0) { squadIds = eligiblePlayers().map(p => p.id); }
  
  const squadPlayers = squadIds.map(id => (state.roster || []).find(p => p.id === id)).filter(Boolean);
  const starters = []; const usedSubs = []; const unused = [];

  squadPlayers.forEach(p => {
    const isStarter = (m.lineup || []).includes(p.id);
    const wasSubbedIn = (m.subs || []).some(s => s.inId === p.id);
    if (isStarter) starters.push(p);
    else if (wasSubbedIn) usedSubs.push(p);
    else unused.push(p);
  });

  const sortedSquad = [
    ...sortPlayerObjs(starters),
    ...sortPlayerObjs(usedSubs),
    ...sortPlayerObjs(unused)
  ];

  let lineupHtml = '';
  sortedSquad.forEach(p => {
    const isStarter = (m.lineup||[]).includes(p.id);
    const wasSubbedIn = (m.subs||[]).some(s => s.inId === p.id);
    let secs = calcPlayerMinutes(m, p.id);
    let minsStr = formatSecsToMinSec(secs);
    const r = (m.ratings && m.ratings[p.id]) ? `${m.ratings[p.id]}★` : '-';
    let statusLabel = isStarter ? '<b>(XI)</b>' : (wasSubbedIn ? '(Sup)' : '(SNU)');
    lineupHtml += `<tr><td style="text-align:left;">${playerLabel(p)} ${statusLabel}</td><td style="white-space:nowrap; padding:0 6px;">${minsStr}</td><td>${r}</td></tr>`;
  });

  let subsHtml = '';
  (m.subs||[]).forEach(s => {
    let minDisplay = s.isHalftime ? 'INT' : (s.minute != null ? window.getGlobalMinuteDisplay(m, s.half, s.minute) + "'" : '-');
    subsHtml += `<tr><td>${minDisplay}</td><td style="color:#C8493F; text-align:left;">↓ ${playerName(s.outId)}</td><td style="color:#16A34A; text-align:left;">↑ ${playerName(s.inId)}</td></tr>`;
  });

  let goalsHtml = '';
  (m.goals||[]).forEach(g => {
     let desc = g.type==='scored' ? `⚽ ${playerName(g.scorerId)} ${g.assistId&&g.assistId!=='none'? '(Ast: '+playerName(g.assistId)+')':''}` : `🥅 Golo Sofrido`;
     let minDisplay = g.minute != null ? window.getGlobalMinuteDisplay(m, g.half, g.minute) + "'" : (g.half===1?"1ªP":"2ªP");
     goalsHtml += `<tr><td>${minDisplay}</td><td style="text-align:left; font-weight:bold;">${desc}</td></tr>`;
  });

  let cardsHtml = '';
  (m.cards||[]).forEach(c => {
    let minDisplay = c.minute != null ? window.getGlobalMinuteDisplay(m, c.half, c.minute) + "'" : '-';
    cardsHtml += `<tr><td>${minDisplay}</td><td style="text-align:left;">${c.color==='Amarelo'?'🟨':'🟥'} ${playerName(c.playerId)}</td></tr>`;
  });

  const selectedStaffIds = m.originalSchedule?.staffCallup || [];
  const staffList = (state.staff || []).filter(st => selectedStaffIds.includes(st.id));
  let staffRowsHtml = '';
  if (staffList.length === 0) {
    staffRowsHtml = '<tr><td colspan="2" style="text-align:center; padding:6px; color:#666;">Equipa Técnica / Delegado não registados.</td></tr>';
  } else {
    staffList.forEach(st => {
      staffRowsHtml += `<tr><td style="text-align:left; font-weight:bold;">${st.name}</td><td style="text-align:center; color:#444;">${st.role || 'Equipa Técnica'}</td></tr>`;
    });
  }

  let html = `<div class="print-card">
    <div class="print-header" style="display:flex; justify-content:space-between; align-items:center; text-align:left;">
      <div>
        <h1 style="margin:0;">Relatório de Jogo</h1>
        <p style="font-size:18px; font-weight:bold; margin:5px 0 0;">${getMyClub()} ${sc} - ${co} ${m.opponent} (${locLabel})</p>
        <p style="margin:5px 0 0;"><b>${getClubAndEscalao()}</b> | ${dateStr} | Época: ${m.season||state.currentSeason} ${m.capitao ? ' | © Capitão: ' + playerName(m.capitao) : ''} | Duração Real: ${totalMatchMins}'</p>
      </div>
      ${getClubLogoHtml()}
    </div>
    <div style="display:flex; gap:20px; margin-bottom:20px; align-items:flex-start;">
      <div style="flex:1.2;">
        <h3>Convocatória e Minutos (${sortedSquad.length} Jogadores)</h3>
        <table><tr><th style="text-align:left;">Jogador</th><th>Min</th><th>Aval</th></tr>${lineupHtml||'<tr><td colspan="3">Sem registo</td></tr>'}</table>
      </div>
      <div style="flex:1;">
        <h3>Substituições</h3>
        <table><tr><th>Min</th><th style="text-align:left;">Saiu</th><th style="text-align:left;">Entrou</th></tr>${subsHtml||'<tr><td colspan="3">Sem registo</td></tr>'}</table>
        <h3 style="margin-top:15px;">Equipa Técnica Presente</h3>
        <table><tr><th style="text-align:left;">Jogador</th><th style="width:70px;">Min</th><th style="width:40px;">Aval</th></tr>
        <h3 style="margin-top:15px;">Cartões</h3>
        <table><tr><th>Min</th><th style="text-align:left;">Jogador</th></tr>${cardsHtml||'<tr><td colspan="2">Sem registo</td></tr>'}</table>
      </div>
    </div>
    <h3>Golos e Ocorrências</h3>
    <table><tr><th style="width:50px;">Min</th><th style="text-align:left;">Evento</th></tr>${goalsHtml||'<tr><td colspan="2">Sem registo</td></tr>'}</table>
    <h3>Notas do Treinador</h3>
    <p style="white-space:pre-wrap; border:1px solid #CCC; padding:10px; border-radius:6px; background:#FFF; min-height:60px;">${m.notes||'Nenhuma nota registada neste jogo.'}</p>
  </div>`;

  return html;
}
// Desenha o campo tático vetorial em SVG para ser impresso no PDF
window.buildMatchTacticalPitchSVG = function(m) {
  if (!m) return '';

  const format = m.tacticalSnapshot?.format || state.tacticFormat || 11;
  const kitColor = m.tacticalSnapshot?.kitColor || state.teamColor || '#D9A441';
  const numColor = getContrastColor(kitColor);
  
  if (!m.tacticalSnapshot || !m.tacticalSnapshot.pieces || m.tacticalSnapshot.pieces.length === 0) {
    if (typeof window.generateMatchTacticalSnapshot === 'function') {
      window.generateMatchTacticalSnapshot(m);
    }
  }

  const pieces = m.tacticalSnapshot?.pieces || [];

  let piecesSVG = '';
  pieces.forEach(p => {
    const pObj = (state.roster || []).find(x => x.id === p.playerId);
    const numLabel = pObj && pObj.number ? String(pObj.number) : (p.label || '?');
    const nameLabel = pObj ? (pObj.name ? pObj.name.split(' ')[0] : '') : (p.name || '');

    const cx = p.x;
    const cy = p.y;

    piecesSVG += `
      <!-- Círculo da Camisola -->
      <circle cx="${cx}" cy="${cy}" r="6" fill="${kitColor}" stroke="#FFFFFF" stroke-width="1" />
      <!-- Número no Centro (Aumentado) -->
      <text x="${cx}" y="${cy + 1.8}" fill="${numColor}" font-size="5" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">${numLabel}</text>
      <!-- Nome em Caixilho Destacado (Totalmente Legível) -->
      ${nameLabel ? `
        <rect x="${cx - 12}" y="${cy + 6.8}" width="24" height="5.5" rx="1.5" fill="rgba(0,0,0,0.75)" />
        <text x="${cx}" y="${cy + 10.8}" fill="#FFFFFF" font-size="3.8" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">${nameLabel}</text>
      ` : ''}
    `;
  });

  return `
    <div style="width:320px; height:480px; margin:0 auto; background:#113821; border:2px solid #000; border-radius:8px; overflow:hidden; position:relative;">
      <svg viewBox="0 0 100 120" style="width:100%; height:100%; display:block;">
        <rect x="0" y="0" width="100" height="120" fill="#113821" />
        <rect x="4" y="4" width="92" height="112" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.5" />
        <line x1="4" y1="60" x2="96" y2="60" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.5" />
        <circle cx="50" cy="60" r="14" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.5" />
        <rect x="22" y="4" width="56" height="18" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.5" />
        <rect x="34" y="4" width="32" height="7" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.5" />
        <rect x="22" y="98" width="56" height="18" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.5" />
        <rect x="34" y="109" width="32" height="7" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.5" />
        ${piecesSVG}
      </svg>
    </div>
  `;
};
window.exportMatchPDF = function(mId) {
  const m = state.matches.find(x => x.id === mId);
  if (!m) return;

  const printArea = document.getElementById('print-area');
  const sc = m.goals ? m.goals.filter(g => g.type === 'scored').length : (m.ourGoals || 0);
  const co = m.goals ? m.goals.filter(g => g.type === 'conceded').length : (m.theirGoals || 0);
  const dateStr = m.date ? m.date.split('-').reverse().join('/') : '-';
  let locLabel = (m.location || 'casa') === 'casa' ? t('match_home') : t('match_away');
  
  let totalMatchMins = 0;
  if (m.isNewManualModel) {
    totalMatchMins = (m.manualHalf1Duration || 0) + (m.manualHalf2Duration || 0);
  } else if (m.singleHalf) {
    totalMatchMins = m.halfDuration || state.defaultHalfDuration || 30;
  } else {
    totalMatchMins = (m.halfDuration || state.defaultHalfDuration || 30) * (m.numberOfHalves || 2);
  }

  // 1. Separar Convocatória e Plantel
  let squadIds = [];
  if (m.originalSchedule && m.originalSchedule.callup && m.originalSchedule.callup.length > 0) {
    squadIds = [...m.originalSchedule.callup];
  } else {
    squadIds = [...new Set([
      ...(m.lineup || []), 
      ...(m.subs || []).map(s => s.inId), 
      ...(m.subs || []).map(s => s.outId),
      ...Object.keys(m.ratings || {})
    ])];
  }

  if (squadIds.length === 0) { squadIds = eligiblePlayers().map(p => p.id); }
  
  const squadPlayers = squadIds.map(id => (state.roster || []).find(p => p.id === id)).filter(Boolean);
  const starters = []; const usedSubs = []; const unused = [];

  squadPlayers.forEach(p => {
    const isStarter = (m.lineup || []).includes(p.id);
    const wasSubbedIn = (m.subs || []).some(s => s.inId === p.id);
    if (isStarter) starters.push(p);
    else if (wasSubbedIn) usedSubs.push(p);
    else unused.push(p);
  });

  // Tabela da Equipa Inicial (Sem a coluna Pos)
  let startersHtml = '';
  sortPlayerObjs(starters).forEach(p => {
    startersHtml += `<tr><td style="text-align:center; font-weight:bold; width:35px; padding:6px 0;">${p.number || '-'}</td><td style="text-align:left; font-weight:bold; padding-left:10px;">${p.name || t('pl_no_name')}</td></tr>`;
  });

  // Tabela Completa da Convocatória com Minutos e Avaliações
  const sortedSquad = [
    ...sortPlayerObjs(starters),
    ...sortPlayerObjs(usedSubs),
    ...sortPlayerObjs(unused)
  ];

  let lineupHtml = '';
  sortedSquad.forEach(p => {
    const isStarter = (m.lineup || []).includes(p.id);
    const wasSubbedIn = (m.subs || []).some(s => s.inId === p.id);
    let secs = calcPlayerMinutes(m, p.id);
    let minsStr = formatSecsToMinSec(secs);
    const r = (m.ratings && m.ratings[p.id]) ? `${m.ratings[p.id]}★` : '-';
    let statusLabel = isStarter ? '<b>(XI)</b>' : (wasSubbedIn ? '(Sup)' : '(SNU)');
    
    lineupHtml += `<tr><td style="text-align:left; padding-left:8px;">${playerLabel(p)} ${statusLabel}</td><td style="white-space:nowrap; text-align:center; padding:0 4px;">${minsStr}</td><td style="text-align:center;">${r}</td></tr>`;
  });

  // 2. Substituições, Golos e Cartões
  let subsHtml = '';
  if (m.subs && m.subs.length > 0) {
    m.subs.forEach(s => {
      let minDisplay = s.isHalftime ? 'INT' : (s.minute != null ? window.getGlobalMinuteDisplay(m, s.half, s.minute) + "'" : '-');
      subsHtml += `<tr><td style="width:40px;">${minDisplay}</td><td style="color:#C8493F; text-align:left; padding-left:6px;">↓ ${playerName(s.outId)}</td><td style="color:#16A34A; text-align:left; padding-left:6px;">↑ ${playerName(s.inId)}</td></tr>`;
    });
  }

  let goalsHtml = '';
  if (m.goals && m.goals.length > 0) {
    m.goals.forEach(g => {
       let subTag = g.goalSubtype === 'penalti' ? ' (Penálti)' : (g.goalSubtype === 'autogolo' ? ' (Autogolo)' : '');
       let desc = '';
       if (g.type === 'scored') {
         desc = g.scorerId === 'autogolo' ? `⚽ Autogolo (Adversário)` : `⚽ ${playerName(g.scorerId)}${subTag} ${g.assistId && g.assistId !== 'none' ? '(Ast: ' + playerName(g.assistId) + ')' : ''}`;
       } else {
         let ownGoalPlayer = g.scorerId ? ` [${playerName(g.scorerId)}]` : '';
         desc = `🥅 Golo Sofrido${subTag}${ownGoalPlayer}`;
       }
       let minDisplay = g.minute != null ? window.getGlobalMinuteDisplay(m, g.half, g.minute) + "'" : (g.half === 1 ? "1ªP" : "2ªP");
       goalsHtml += `<tr><td style="width:50px;">${minDisplay}</td><td style="text-align:left; font-weight:bold; padding-left:10px;">${desc}</td></tr>`;
    });
  }

  let cardsHtml = '';
  if (m.cards && m.cards.length > 0) {
    m.cards.forEach(c => {
      let minDisplay = c.minute != null ? window.getGlobalMinuteDisplay(m, c.half, c.minute) + "'" : '-';
      cardsHtml += `<tr><td style="width:50px;">${minDisplay}</td><td style="text-align:left; padding-left:10px;">${c.color === 'Amarelo' ? '🟨' : '🟥'} ${playerName(c.playerId)}</td></tr>`;
    });
  }

  // 3. Equipa Técnica Presente em Linha
  const selectedStaffIds = m.originalSchedule?.staffCallup || [];
  const staffList = (state.staff || []).filter(st => selectedStaffIds.includes(st.id));
  let staffStr = staffList.length > 0 
    ? staffList.map(st => `<b>${st.name}</b> (${st.role || 'Equipa Técnica'})`).join(' &nbsp;•&nbsp; ')
    : 'Sem registo oficial de elementos presentes.';

  // 4. Desenho do Campo Tático
  const tacticalPitchSVG = window.buildMatchTacticalPitchSVG ? window.buildMatchTacticalPitchSVG(m) : '';

  let html = `<div class="print-card" style="padding:20px; font-family:-apple-system, sans-serif;">
    <!-- CABEÇALHO COM EMBLEMA DO CLUBE -->
    <div class="print-header" style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #000; padding-bottom:10px; margin-bottom:15px;">
      <div>

window.exportSeasonPDF = function(season){
  const seasonId = season || state.currentSeason;
  const seasonMatches = (state.matches || [])
    .filter(m => (m.season || state.currentSeason) === seasonId)
    .slice()
    .sort((a,b) => {
      const dateA = a && a.date ? String(a.date) : '';
      const dateB = b && b.date ? String(b.date) : '';
      return dateA.localeCompare(dateB);
    });

  if (seasonMatches.length === 0) {
    showToast('Sem jogos registados nesta época para exportar.');
    return;
  }

  const combinedHtml = seasonMatches
    .map(m => `<div style="page-break-after: always;">${buildMatchReportHTML(m)}</div>`)
    .join('');

  const printArea = document.getElementById('print-area');
  if (printArea) {
    printArea.innerHTML = combinedHtml;
    window.openSafePrintModal();
  } else {
    showToast('Erro ao aceder à área de impressão.');
  }
};
// 1. Gera ou atualiza a disposição tática padrão dos titulares do jogo
window.generateMatchTacticalSnapshot = function(m) {
  if (!m) return;
  
  const format = state.tacticFormat || 11;
  const starters = (m.lineup || []).slice(0, format);
  const ownKitColor = state.teamColor || '#D9A441';
  
  // Se o jogo já tiver tática guardada, não sobrescreve a menos que seja forçado
  if (!m.tacticalSnapshot) {
    m.tacticalSnapshot = {
      format: format,
      kitColor: ownKitColor,
      pieces: []
    };
  }

  // Se não houver peças colocadas, desenha a formação padrão no campo
  if (!m.tacticalSnapshot.pieces || m.tacticalSnapshot.pieces.length === 0) {
    const pieces = [];
    starters.forEach((pId, idx) => {
      const p = (state.roster || []).find(x => x.id === pId);
      const numLabel = p && p.number ? String(p.number) : String(idx + 1);
      const nameLabel = p ? (p.name ? p.name.split(' ')[0] : '') : '';

      // Posições percentuais padrão (distribuição simples em campo)
      let x = 50, y = 85; // Guarda-redes
      if (idx > 0) {
        let row = Math.floor((idx - 1) / 3);
        let col = (idx - 1) % 3;
        x = 25 + (col * 25);
        y = 65 - (row * 20);
      }

      pieces.push({
        id: pId || uid(),
        playerId: pId,
        label: numLabel,
        name: nameLabel,
        x: x,
        y: Math.max(15, y)
      });
    });

    m.tacticalSnapshot.pieces = pieces;
  }

  saveState();
};

// 2. Abre o Quadro Tático associado ao jogo atual
window.openMatchTacticalBoard = function(mId) {
  const m = state.matches.find(x => x.id === mId);
  if (!m) return;

  // Garante que o snapshot existe com a equipa inicial
  window.generateMatchTacticalSnapshot(m);

  // Define o estado de edição exclusiva do jogo
  window.editingMatchTacticsId = mId;
  state.tacticFormat = m.tacticalSnapshot.format || state.tacticFormat || 11;
  state.tactics = (m.tacticalSnapshot.pieces || []).map(p => ({
    id: p.id || uid(),
    kind: 'own',
    playerId: p.playerId,
    label: p.label,
    x: p.x,
    y: p.y
  }));

  saveState();
  navigateToHub('estrategia');
  navigateToTab('tatica');
};
window.saveMatchTacticalBoardAndReturn = function() {
  const mId = window.editingMatchTacticsId;

function computeStats(typeFilterVal, seasonFilterVal, phaseFilterVal, tournamentFilterVal){
  let scored=0, conceded=0; let scoredHalf={1:0,2:0}, concededHalf={1:0,2:0};
  let scorerCount = {}, assistCount = {}, yellowCount = {}, redCount = {};
  let wins=0, draws=0, losses=0; let casaWins=0, casaDraws=0, casaLosses=0, foraWins=0, foraDraws=0, foraLosses=0;
  
  let seasonMatches = state.matches.filter(m => (!typeFilterVal || typeFilterVal==='todos' || m.type===typeFilterVal) && (!seasonFilterVal || seasonFilterVal==='todas' || getEntitySeason(m)===seasonFilterVal));
  const availablePhases = [...new Set(seasonMatches.map(m=> (m.phase||'').trim()).filter(p=>p!==''))].sort();
  const availableTournaments = [...new Set(seasonMatches.filter(m=>m.type==='torneio').map(m=> (m.tournamentName||'').trim()).filter(p=>p!==''))].sort();
  const matches = seasonMatches.filter(m => (!phaseFilterVal || phaseFilterVal==='todas' || (m.phase||'').trim()===phaseFilterVal))
                                .filter(m => (!tournamentFilterVal || tournamentFilterVal==='todas' || (m.tournamentName||'').trim()===tournamentFilterVal));

  const last6Matches = [...matches].filter(m=>m.finished).sort((a,b) => new Date(a.date) - new Date(b.date)).slice(-6);
  const last5Form = [...matches].filter(m=>m.finished).sort((a,b) => new Date(a.date) - new Date(b.date)).slice(-5).map(m => { const sc = m.goals.filter(g=>g.type==='scored').length; const co = m.goals.filter(g=>g.type==='conceded').length; return sc > co ? 'V' : (sc === co ? 'E' : 'D'); });

  matches.forEach(m=>{
    const mScored = m.goals.filter(g=>g.type==='scored').length; const mConceded = m.goals.filter(g=>g.type==='conceded').length; const loc = m.location || 'casa';
    if(m.finished){ if(mScored > mConceded){ wins++; loc==='casa'?casaWins++:foraWins++; } else if(mScored === mConceded){ draws++; loc==='casa'?casaDraws++:foraDraws++; } else { losses++; loc==='casa'?casaLosses++:foraLosses++; } }
    m.goals.forEach(g=>{ if(g.type==='scored'){ scored++; scoredHalf[g.half]++; if(g.scorerId && g.scorerId !== 'autogolo') scorerCount[g.scorerId] = (scorerCount[g.scorerId]||0)+1; if(g.assistId && g.assistId !== 'none' && g.assistId !== 'unknown') assistCount[g.assistId] = (assistCount[g.assistId]||0)+1; } else { conceded++; concededHalf[g.half]++; } });
    (m.cards||[]).forEach(c=>{ if(c.color==='Amarelo') yellowCount[c.playerId] = (yellowCount[c.playerId]||0)+1; else redCount[c.playerId] = (redCount[c.playerId]||0)+1; });
  });
  
  const scorers = Object.entries(scorerCount).map(([id,count])=>({id, name: playerName(id), count})).sort((a,b)=>b.count-a.count);
  const assisters = Object.entries(assistCount).map(([id,count])=>({id, name: playerName(id), count})).sort((a,b)=>b.count-a.count);
  const cardRanking = [...new Set([...Object.keys(yellowCount), ...Object.keys(redCount)])].map(id=>({id, name: playerName(id), yellow: yellowCount[id]||0, red: redCount[id]||0})).sort((a,b)=>(b.yellow+b.red)-(a.yellow+a.red));
  
  return { scored, conceded, scoredHalf, concededHalf, scorers, assisters, wins, draws, losses, casaWins, casaDraws, casaLosses, foraWins, foraDraws, foraLosses, cardRanking, last6Matches, last5Form, availablePhases, availableTournaments, matches };
}

// Estatísticas de plantel restritas aos jogos de uma competição/fase específica
function computeCompetitionPlayerStats(matches){
  // 1. Lê todo o plantel ativo (para ninguém ficar de fora, mesmo com 0 minutos)
  let activeRoster = (state.roster || []).filter(p => p.active !== false);
  
  // 2. Ordena IMEDIATAMENTE os jogadores com base na tua escolha do ecrã PLANTEL (Posição, Nome ou Número)
  activeRoster = sortPlayerObjs(activeRoster);

  // 3. Calcula as estatísticas respeitando essa mesma ordem
  const rows = activeRoster.map(p => {
    let minutes = 0, starts = 0, goals = 0, assists = 0, yellow = 0, red = 0;
    matches.forEach(m => {
      minutes += Math.round(calcPlayerMinutes(m, p.id) / 60);
      if ((m.lineup || []).includes(p.id)) starts++;
      (m.goals || []).forEach(g => {
        if (g.type === 'scored' && g.scorerId === p.id) goals++;
        if (g.type === 'scored' && g.assistId === p.id) assists++;
      });
      (m.cards || []).forEach(c => {
        if (c.playerId === p.id) { if (c.color === 'Amarelo') yellow++; else red++; }
      });
    });
    return { id: p.id, name: playerLabel(p), minutes, starts, goals, assists, yellow, red };
  });

  // Retorna a tabela pronta e selada com a ordem oficial do Plantel!
  return rows;
}

// Métricas de treino: Conta desde o início da época (ou data de entrada) até ao último jogo da fase.
function computeTrainingMetricsForMatches(matches){
  const finishedMatches = matches.filter(m => m.date);
  if (finishedMatches.length === 0) return { count: 0, pct: null, startDate: null, endDate: null };

  const dates = finishedMatches.map(m => m.date).sort();
  const endDate = dates[dates.length - 1]; // Limite é o último jogo da competição
  const matchSeason = matches[0].season || state.currentSeason;

  // Vai buscar todos os treinos da época que aconteceram ANTES ou NO DIA do último jogo
  const trainingsInRange = (state.trainings || [])
    .filter(tr => getEntitySeason(tr) === matchSeason && tr.date <= endDate && (tr.status === undefined || tr.status === 'completed'))
    .sort((a, b) => new Date(a.date) - new Date(b.date));

  if (trainingsInRange.length === 0) return { count: 0, pct: null, startDate: dates[0], endDate };

  // O startDate real é o dia do primeiro treino da época!
  const startDate = trainingsInRange[0].date;
  
  let minutosOferecidos = 0, minutosCumpridos = 0;
  trainingsInRange.forEach(tr => {
    const dur = parseInt(tr.duration, 10) || 90;
    (state.roster || []).filter(p => p.active !== false).forEach(p => {
      if (p.joinDate && tr.date < p.joinDate) return; // Se ainda não era do clube, não conta
      
      minutosOferecidos += dur;
      let isAbsent = false;
      if (Array.isArray(tr.absences)) { isAbsent = tr.absences.includes(p.id); }
      else if (tr.absences && tr.absences[p.id]) { isAbsent = true; }
      
      if (isAbsent) {
        if (tr.customMinutes && tr.customMinutes[p.id] != null) minutosCumpridos += parseInt(tr.customMinutes[p.id], 10);
      } else {
        minutosCumpridos += dur;
      }
    });
  });

  const pct = minutosOferecidos > 0 ? Math.round((minutosCumpridos / minutosOferecidos) * 100) : null;
  return { count: trainingsInRange.length, pct, startDate, endDate };
}

function calcularEstatisticaJogador(playerId, targetSeason = state.currentSeason, typeFilter = 'todos', phaseFilter = 'todas', tourFilter = 'todas') {
  let golos = 0, assistencias = 0, amarelos = 0, vermelhos = 0, somaAvaliacoes = 0, numAvaliacoes = 0, faltasTreino = 0, jogosTitular = 0, totalSegundosJogo = 0, presencasTreino = 0, jogosConvocado = 0, jogosUtilizado = 0;
  let minutosTreinoCumpridos = 0, minutosTreinoTotais = 0, golosSofridos = 0;
  
  if (!IS_LICENSED || !state || !playerId) {
    return { golos:0, assistencias:0, amarelos:0, vermelhos:0, media:'-', faltasTreino:0, presencasTreino:0, totalTreinos:0, minutosTreinoCumpridos:0, minutosTreinoTotais:0, jogosTitular:0, jogosConvocado:0, jogosUtilizado:0, minutos:"0m 0s", totalSegundosJogo:0, golosSofridos:0 };
  }

  const validTrainings = (state.trainings || []).filter(tr => tr && (tr.status === undefined || tr.status === 'completed') && (targetSeason === 'TUDO' || getEntitySeason(tr) === targetSeason));
  
  let totalTreinos = validTrainings.length;
  validTrainings.forEach(tr => { minutosTreinoTotais += (parseInt(tr.duration, 10) || 90); });

  const pInfo = state.roster.find(x=>x.id===playerId);
  const isGK = pInfo && typeof pInfo.positions === 'string' && getPosRank(pInfo.positions) === 1;

  (state.matches || []).filter(m => {
    if (!m) return false;
    if (targetSeason !== 'TUDO' && getEntitySeason(m) !== targetSeason) return false;
    if (typeFilter !== 'todos' && m.type !== typeFilter) return false;
    if (typeFilter === 'campeonato' && phaseFilter !== 'todas' && (m.phase||'').trim() !== phaseFilter) return false;
    if (typeFilter === 'torneio' && tourFilter !== 'todas' && (m.tournamentName||'').trim() !== tourFilter) return false;
    return true;
  }).forEach(m => {
    const usedInMatch = (m.lineup || []).includes(playerId) || (m.subs || []).some(s => s && s.inId === playerId);
    const calledUpList = (m.originalSchedule && m.originalSchedule.callup && m.originalSchedule.callup.length > 0) ? m.originalSchedule.callup : null;
    
    // Convocatória conta SEMPRE
    if (calledUpList ? calledUpList.includes(playerId) : usedInMatch) jogosConvocado++;

    if (state.trackSubs && m.finished) {
      // SE NÃO FOR PARA IGNORAR, CONTA TUDO O RESTO
      if (!m.ignoreMinutes) {
        if (usedInMatch) jogosUtilizado++;
        if ((m.lineup || []).includes(playerId)) jogosTitular++; 
        if (typeof calcPlayerMinutes === 'function') totalSegundosJogo += calcPlayerMinutes(m, playerId); 
      }
    }    
    (m.goals || []).forEach(g => { 
      if (g && g.type === 'scored' && g.scorerId === playerId) golos++; 
      if (g && g.type === 'scored' && g.assistId === playerId) assistencias++; 
      
      if (g && g.type === 'conceded') {
          if (g.gkId && g.gkId !== 'auto' && g.gkId !== 'none') {
              // Se selecionaste explicitamente o jogador (GR ou jogador de campo adaptado)
              if (g.gkId === playerId) golosSofridos++;
          } else {
              // Apenas aplica o cálculo legado se fores um GR de ofício (para jogos antigos)
              if (isGK) {
                  if (!state.trackSubs || m.ignoreMinutes || !m.lineup || m.lineup.length === 0) {
                      // Se ignoraste os minutos e não marcaste manual, assume o Titular
                      if (m.lineup && m.lineup.includes(playerId)) golosSofridos++;
                  } else {
                      let goalHalf = g.half || 1; let goalMin = g.minute || 0;
                      let currentXI = [...(m.lineup || [])];
                      let subsBeforeGoal = (m.subs || []).filter(s => {
                          if (s.half < goalHalf) return true;
                          if (s.half === goalHalf) { if (s.isHalftime) return true; return (s.minute || 0) <= goalMin; }
                          return false;
                      }).sort((a,b) => (a.half - b.half) || (a.isHalftime ? -1 : 1) || ((a.minute||0) - (b.minute||0)));
                      subsBeforeGoal.forEach(s => { currentXI = currentXI.filter(id => id !== s.outId); currentXI.push(s.inId); });
                      if (currentXI.includes(playerId)) golosSofridos++;
                  }
              }
          }
      }
    });  
    (m.cards || []).forEach(c => { 
      if (c && c.playerId === playerId) { if (c.color === 'Amarelo') amarelos++; else vermelhos++; } 
    });
    if (m.ratings && m.ratings[playerId]) { somaAvaliacoes += m.ratings[playerId]; numAvaliacoes++; }
  });
  
  validTrainings.forEach(tr => {
    const dur = parseInt(tr.duration, 10) || 90;
    let absReason = null;
    if (Array.isArray(tr.absences)) { absReason = tr.absences.includes(playerId) ? 'injustificada' : null; }
    else if (tr.absences && tr.absences[playerId]) { absReason = tr.absences[playerId]; }

    // Só razões de ausência total (nunca esteve no treino) contam como falta.
    // Atrasado/Dispensado/Lesão/Castigo significam que esteve presente parte do tempo — conta como presença.
    const trueAbsenceReasons = ['injustificada', 'justificada'];

    if (absReason && trueAbsenceReasons.includes(absReason)) {
      faltasTreino++;
      if (tr.customMinutes && tr.customMinutes[playerId] != null) { minutosTreinoCumpridos += parseInt(tr.customMinutes[playerId], 10); }
    } else if (absReason) {
      presencasTreino++;
      minutosTreinoCumpridos += (tr.customMinutes && tr.customMinutes[playerId] != null) ? parseInt(tr.customMinutes[playerId], 10) : 0;
    } else { 
      presencasTreino++; minutosTreinoCumpridos += dur; 
    }
  });
  
  return { 
    golos, assistencias, amarelos, vermelhos, 
    media: numAvaliacoes > 0 ? (somaAvaliacoes / numAvaliacoes).toFixed(1) : '-', 
    faltasTreino, presencasTreino, totalTreinos, 
    minutosTreinoCumpridos, minutosTreinoTotais,
    jogosTitular, jogosConvocado, jogosUtilizado, 
    minutos: formatSecsToMinSec(totalSegundosJogo),
    totalSegundosJogo, golosSofridos 
  };
}
function generatePlayerBarsHTML(stats, maxStats, isGK = false, isPDF = false) {

    const maxMins = Math.round((maxStats.minutos || 1) / 60) || 1;

        { label: 'TITUL.', val: stats.jogosTitular || 0, max: maxStats.jogos || 1, color: '#059669' }
    ];

    if (isGK) {

            label: 'SOFRIDOS',
            val: stats.golosSofridos || 0,

            color: '#DC2626'

    attrs.forEach(a => {
        let pct = a.max > 0 ? (a.val / a.max) * 100 : 0;
        pct = Math.min(100, Math.max(0, pct));
        
        html += `<div style="display:flex; align-items:center; font-size:9px;">
          <div style="width:52px; color:${labelColor}; font-weight:bold;">${a.label}</div>
          <div style="flex:1; background:${barBg}; height:6px; border-radius:3px; overflow:hidden; margin:0 8px;">
            <div style="width:${pct}%; height:100%; background:${a.color}; border-radius:3px;"></div>
          </div>
          <div style="width:25px; text-align:right; font-weight:bold; font-family:ui-monospace, monospace; color:${valColor};">${a.val}</div>
        </div>`;
    });
    html += '</div>';
    return html;
}

function generateDonutChartSVG(minutosCumpridos, minutosTotais) {
    const size = 100; const cx = 50; const cy = 50; const r = 35;
    if(!minutosTotais || minutosTotais === 0) return `<svg viewBox="0 0 100 100" style="width:100%; height:auto; max-width:100px; margin:0 auto; display:block;"><circle cx="50" cy="50" r="35" fill="none" stroke="var(--surface-2)" stroke-width="12"/></svg>`;
    
    // Calcula a percentagem exata com base nos minutos de treino
    const pctP = Math.min(1, Math.max(0, minutosCumpridos / minutosTotais)); 
    const dashP = pctP * 2 * Math.PI * r; 
    const dashEmpty = 2 * Math.PI * r;
    
    return `<svg viewBox="0 0 100 100" style="width:100%; height:auto; max-width:120px; margin:0 auto; display:block; transform:rotate(-90deg);"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--red)" stroke-width="14"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--green)" stroke-width="14" stroke-dasharray="${dashP} ${dashEmpty}" /><text x="${cx}" y="${cy}" fill="currentColor" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="central" transform="rotate(90, ${cx}, ${cy})">${Math.round(pctP*100)}%</text></svg>`;
}

lor:var(--gold); color:var(--gold);':''}" onclick="uiAddLeagueMatch('${lg.id}')">${isEditingMatch ? t('save') : t('lg_add_match')}</button></div></div>`;

window.clearPlayerPos = function(id) {
    const p = state.roster.find(x=>x.id===id);
    if(p) { p.positions = ''; saveState(); render(); }
};

window.togglePlayerPos = function(id, pos) {
    const p = state.roster.find(x=>x.id===id); if(!p) return;
    let safePos = typeof p.positions === 'string' ? p.positions : '';
    let cur = safePos.split(',').map(x=>x.trim()).filter(Boolean);
    if(cur.includes(pos)) cur = cur.filter(x=>x!==pos);
    else { if(cur.length >= 5) { showToast('Máximo de 5 posições!'); return; } cur.push(pos); }
    p.positions = cur.join(', '); saveState(); render();
};

window.saveStaffMember = function() {
  if (!staffForm || !staffForm.name) { showToast('Preencha o nome do elemento.'); return; }
  if (!state.staff) state.staff = [];
  const cleanStaff = { ...staffForm, name: escapeHTML((staffForm.name||'').trim()), role: escapeHTML((staffForm.role||'').trim()) };
  if (cleanStaff.id) {
    const idx = state.staff.findIndex(s => s.id === cleanStaff.id);
    if (idx !== -1) state.staff[idx] = cleanStaff;
  } else {
    cleanStaff.id = 'st_' + Date.now();
    state.staff.push(cleanStaff);
  }
  saveState();
  staffForm = null;
  render();
  showToast('Elemento guardado!');
};

window.deleteStaffMember = function(id) {
  state.staff = (state.staff || []).filter(s => s.id !== id);
  saveState();
  render();
  showToast('Elemento removido.');
};
window.exportPlayerPDF = function(pId) {
  const p = (state.roster || []).filter(x => x.active !== false).find(x => x.id === pId);
  if (!p) { showToast('Atleta não encontrado.'); return; }

  const activeSeason = window.statsSeasonFilter === 'todas' ? 'TUDO' : (window.statsSeasonFilter || state.currentSeason);
  const st = calcularEstatisticaJogador(p.id, activeSeason);

  let totalMatchSecs = 0, totalTeamGoals = 0, totalTeamAssists = 0, totalTeamConceded = 0, totalFinishedMatches = 0;
  (state.matches || []).filter(m => m && m.finished && !m.ignoreMinutes && (activeSeason === 'TUDO' || getEntitySeason(m) === activeSeason)).forEach(m => {
    totalFinishedMatches++;
    (m.goals || []).forEach(g => {
      if (g.type === 'scored') {
        totalTeamGoals++;
        if (g.assistId && g.assistId !== 'none' && g.assistId !== 'unknown') totalTeamAssists++;
      } else if (g.type === 'conceded') {
        totalTeamConceded++;
      }
    });
    if (m.timer && (m.timer.half1DurationMs != null || m.timer.half2DurationMs != null || m.timer.elapsedMs != null)) {
      let ms1 = m.timer.half1DurationMs || 0, ms2 = m.timer.half2DurationMs || 0;
      let msTotal = (ms1 + ms2) > 0 ? (ms1 + ms2) : (m.timer.elapsedMs || 0);
      totalMatchSecs += Math.round(msTotal / 1000);
    } else {
      totalMatchSecs += ((m.manualMatchDuration || 90) * 60);
    }
  });

  const maxStats = {
    minutos: totalMatchSecs || 1,
    golos: totalTeamGoals || 1,
    assist: totalTeamAssists || 1,
    jogos: totalFinishedMatches || 1,
    golosSofridos: totalTeamConceded || 1
  };

  const safePos = typeof p.positions === 'string' ? p.positions : '';
  const firstPos = safePos ? safePos.split(',')[0].trim() : 'N/D';
  const otherPos = safePos ? safePos.split(',').slice(1).map(x => x.trim()).join(', ') || '—' : '—';
  const isGK = safePos.toUpperCase().includes('GR') || safePos.toUpperCase().includes('GK');
  const age = p.birthDate ? computeAge(p.birthDate) : null;

  const playerBarsHtml = generatePlayerBarsHTML(st, maxStats, isGK, true);
  const donutChartHtml = generateDonutChartSVG(st.minutosTreinoCumpridos, st.minutosTreinoTotais);

  let html = `
  <div class="print-card" style="padding:20px; font-family:-apple-system, sans-serif;">
    <div class="print-header" style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #000; padding-bottom:10px; margin-bottom:15px;">
      <div style="flex:1;">
        <h1 style="font-size:22px; margin:0; text-transform:uppercase; color:#000;">FICHA DE RENDIMENTO INDIVIDUAL</h1>
        <div style="font-size:18px; font-weight:bold; margin-top:4px; color:#333;">${p.number ? `${p.number} ` : ''}${p.name}</div>
        <p style="font-size:11px; color:#555; margin:3px 0 0 0;">Clube: <b>${getClubAndEscalao()}</b> | Época: <b>${activeSeason === 'TUDO' ? 'Histórico Total' : activeSeason}</b></p>
      </div>

    <div style="background:#F3F4F6; border:1px solid #E5E7EB; border-radius:8px; padding:10px 14px; margin-bottom:15px; display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:11px;">
      <div><b>Posição Principal:</b> ${firstPos}</div>

window.renderPlantel = function() {

          <button class="seg-btn ${currentSort==='nome'?'active':''}" style="font-size:9px; padding:4px 8px;" onclick="state.rosterSortBy='nome'; saveState(); render();">${t('pl_sort_name')}</button>

      html += `<div class="empty">${t('pl_none')}</div>

    } else {
      let totalMatchSecs = 0;
      let totalTeamGoals = 0;
      let totalTeamAssists = 0;
      let totalTeamConceded = 0;
      let totalFinishedMatches = 0;

      (state.matches || []).filter(m => m && m.finished && !m.ignoreMinutes && (m.season || state.currentSeason) === state.currentSeason).forEach(m => {
          totalFinishedMatches++;
          
          (m.goals || []).forEach(g => {

                      totalTeamAssists++;

                  totalTeamConceded++;
              }

          if (m.timer && (m.timer.half1DurationMs != null || m.timer.half2DurationMs != null || m.timer.elapsedMs != null)) {
              let ms1 = m.timer.half1DurationMs || 0;
              let ms2 = m.timer.half2DurationMs || 0;

          const p1Obj = (state.roster || []).find(x => x.id === window.compareP1);

          const pos2 = p2Obj && typeof p2Obj.positions === 'string' ? p2Obj.positions.toUpperCase() : '';

          const isGK2 = pos2.includes('GR') || pos2.includes('GK');

              let c1 = 'var(--chalk)', c2 = 'var(--chalk)';
              if (val1 > val2) { c1 = invert ? 'var(--red)' : 'var(--green)'; c2 = invert ? 'var(--green)' : 'var(--red)'; } 
              else if (val2 > val1) { c2 = invert ? 'var(--red)' : 'var(--green)'; c1 = invert ? 'var(--green)' : 'var(--red)';}

            <div style="display:flex; align-items:center; gap:10px;">
              <div style="width:32px; height:32px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:14px;">👔</div>

window.uiAddPlayer = function(){ try { if(!state.roster) state.roster = []; const input = document.getElementById('new-player-input'); if(!input) return; const v = input.value; if(v && v.trim() !== '') { state.roster.push({ id: uid(), name: escapeHTML(v.trim()), birthDate: null, number: null, positions: '', active: true, joinDate: new Date().toISOString().slice(0,10) }); input.value = ''; saveState(); render(); } } catch(e) { console.error("Error:", e); alert(t('msg_err_add_pl') + e.message); } };
window.updatePlayerName = function(id, val){ const p=state.roster.find(x=>x.id===id); if(p){p.name=escapeHTML(val.trim()); saveState(); render();} };
window.updatePlayerNumber = function(id, val){ const p=state.roster.find(x=>x.id===id); if(p){p.number=parseInt(val)||null; saveState(); render();} };
window.updatePlayerNotes = function(id, val) {
  const p = (state.roster || []).find(x => x.id === id);
  if (p) {
    p.notes = escapeHTML(val.trim());
    saveState();
  }
};
window.updatePlayerBirthDate = function(id, val){ 
  const p = state.roster.find(x=>x.id===id); 
  if(!p) return;
  if(!val || val.trim() === ''){ p.birthDate = null; saveState(); render(); return; }
  let str = val.trim().replace(/[\/\-]/g, '.');
  let pts = str.split('.');
  if(pts.length !== 3){ showToast("Usa o formato: dia.mes.ano"); render(); return; }
  let d = parseInt(pts[0], 10); let m = parseInt(pts[1], 10); let y = parseInt(pts[2], 10);
  if(y < 100) y += (y < 30 ? 2000 : 1900); 
  let dateObj = new Date(y, m-1, d);
  if(isNaN(dateObj.getTime()) || dateObj.getDate() !== d || dateObj.getMonth() !== m-1){ showToast("Data inválida! Verifica o dia/mês."); render(); return; }
  if(dateObj > new Date()){ showToast("O jogador não pode nascer no futuro!"); render(); return; }
  p.birthDate = `${String(d).padStart(2,'0')}.${String(m).padStart(2,'0')}.${y}`;
  saveState(); render();
};

window.removePlayer = function(id){ const p=state.roster.find(x=>x.id===id); if(p){ p.active=false; saveState(); render(); } };

window.exportData = function(){ 
  if (!IS_LICENSED) {
    showToast('Ação não permitida nesta licença.', 'btn-red');
    return;
  }

  state.lastBackupDate = Date.now(); 
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'}); 
  const url = URL.createObjectURL(blob); 
  const a = document.createElement('a'); 
  a.href = url; 
  a.download = `coachfolio-backup-${new Date().toISOString().slice(0,10)}.json`; 
  document.body.appendChild(a); 
  a.click(); 
  a.remove(); 
  URL.revokeObjectURL(url); 
  saveState(); 
  render(); 
  showToast(t('msg_bkp_exp')); 
};

function sanitizeData(obj) {
  if (typeof obj === 'string') return escapeHTML(obj);
  if (Array.isArray(obj)) return obj.map(sanitizeData);
  if (obj && typeof obj === 'object') {
    const sanitized = {};
    for (let k in obj) {
      if (Object.prototype.hasOwnProperty.call(obj, k)) {
        sanitized[k] = sanitizeData(obj[k]);
      }
    }
    return sanitized;
  }
  return obj;
}
window.exportDataJSON = window.exportData;

window.importData = function(input){ 
  const file = input.files[0]; 
  if(!file) return; 
  const reader = new FileReader(); 
  reader.onload = (e) => { 
    try { 
      const p = JSON.parse(e.target.result); 
      if(!p.roster || !p.matches) throw new Error('inv'); 
      askConfirm(t('msg_overwrite'), () => { 
        state = sanitizeData(p); 
        if(!state.schedule) state.schedule = []; 
        if(!state.trainings) state.trainings = []; 
        if(!state.videos) state.videos = []; 
        if(!state.diary) state.diary = []; 
        if(!state.leagues) state.leagues = []; 
        if(!state.fines) state.fines = []; 
        if(!state.staff) state.staff = [];
        if(!state.teamColor) state.teamColor = '#D9A441'; 
        if(!state.oppColor) state.oppColor = '#C8493F'; 
        if(!state.seasonFormat) state.seasonFormat = 'europeu'; 
        if(!state.currentSeason) state.currentSeason = defaultSeason(); 
        if(state.enableLeagues===undefined) state.enableLeagues=true; 
        if(state.enableFines===undefined) state.enableFines=false; 
        if(state.enableBirthdays===undefined) state.enableBirthdays=false; 
        if(state.trackSubs===undefined) state.trackSubs=true; 
        if(state.keepScreenAwake===undefined) state.keepScreenAwake=false;
        state.lastBackupDate = Date.now(); 
        saveState(); 
        render(); 
        showToast(t('msg_bkp_imp')); 
      }); 
    } catch(err) { 
      showToast(t('msg_inv_file')); 
    } 
  }; 
  reader.readAsText(file); 
  input.value = ''; 
};

function render(){

      }
      
      if (typeof manageWakeLock === 'function') manageWakeLock();
      
  } catch (error) {
      console.error(error);
      const app = document.getElementById('app');
      if (app) {
          app.innerHTML = `<div style="text-align:center; padding:40px 20px; color:var(--chalk);">
            <div style="font-size:50px; margin-bottom:20px;">⚠️</div>
            <h2 style="color:var(--red); text-transform:uppercase;">Erro de Sistema</h2>
            <p style="font-size:14px; margin-bottom:30px; color:var(--muted);">A tática falhou, mas os teus dados estão a salvo. Por favor, exporta a tua base de dados para garantir a segurança da informação.</p>
            <button class="btn btn-gold" style="width:100%; margin-bottom:10px;" onclick="exportData()">💾 Exportar Backup (JSON)</button>
            <button class="btn btn-outline" style="width:100%;" onclick="window.location.reload()">🔄 Recarregar App</button>
          </div>`;
      }
  }
}

function getClubLogoHtml() {

// FUNÇÃO PARA CARREGAR O EMBLEMA DO CLUBE (com atualização imediata do modal)
window.uploadClubLogo = function(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const maxDim = 200;
      let width = img.width;
      let height = img.height;
      if (width > height) {
        if (width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; }
      } else {
        if (height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; }
      }
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      // Preenche a branco antes de desenhar, para que emblemas com fundo
      // transparente (a maioria dos PNGs de clube) não fiquem com um
      // quadrado preto à volta ao serem convertidos para JPEG.
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      state.clubLogo = canvas.toDataURL('image/jpeg', 0.8);
      saveState();
      const modalRoot = document.getElementById('modal-root');
      if (modalConfig && modalConfig.type === 'settings' && modalRoot) {
        modalRoot.innerHTML = renderModalHTML();
      }
      render();
      showToast('Emblema otimizado e guardado! 🛡️');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
};
